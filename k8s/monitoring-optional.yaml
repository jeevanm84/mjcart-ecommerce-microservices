apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mjcart-services
  namespace: mjcart
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
    - mjcart
  selector:
    matchLabels:
      mjcart-monitor: "true"
  endpoints:
  - port: http
    path: /metrics
    interval: 15s

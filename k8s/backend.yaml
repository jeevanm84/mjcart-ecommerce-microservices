apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: mjcart
spec:
  selector: { app: api-gateway }
  ports: [{ port: 8080, targetPort: 8080 }]
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: mjcart
spec:
  replicas: 2
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: api-gateway
          image: <YOUR_ECR_OR_REGISTRY>/api-gateway:latest
          ports: [{ containerPort: 8080 }]
          env:
            - name: AUTH_URL
              valueFrom: { configMapKeyRef: { name: app-config, key: AUTH_URL } }
            - name: USER_URL
              valueFrom: { configMapKeyRef: { name: app-config, key: USER_URL } }
            - name: PRODUCT_URL
              valueFrom: { configMapKeyRef: { name: app-config, key: PRODUCT_URL } }
            - name: INVENTORY_URL
              valueFrom: { configMapKeyRef: { name: app-config, key: INVENTORY_URL } }
            - name: CART_URL
              valueFrom: { configMapKeyRef: { name: app-config, key: CART_URL } }
            - name: ORDER_URL
              valueFrom: { configMapKeyRef: { name: app-config, key: ORDER_URL } }
            - name: SHIPPING_URL
              valueFrom: { configMapKeyRef: { name: app-config, key: SHIPPING_URL } }
            - name: NOTIFICATION_URL
              valueFrom: { configMapKeyRef: { name: app-config, key: NOTIFICATION_URL } }
            - name: REVIEW_URL
              valueFrom: { configMapKeyRef: { name: app-config, key: REVIEW_URL } }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: mjcart
spec:
  selector: { app: auth-service }
  ports: [{ port: 4001, targetPort: 4001 }]
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: mjcart
spec:
  replicas: 2
  selector: { matchLabels: { app: auth-service } }
  template:
    metadata: { labels: { app: auth-service } }
    spec:
      containers:
        - name: auth-service
          image: <YOUR_ECR_OR_REGISTRY>/auth-service:latest
          ports: [{ containerPort: 4001 }]
          env:
            - name: PORT
              value: "4001"
            - name: DB_HOST
              valueFrom: { configMapKeyRef: { name: app-config, key: DB_HOST } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: mjcart-secrets, key: mysql-user } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: mjcart-secrets, key: mysql-root-password } }
            - name: REDIS_HOST
              valueFrom: { configMapKeyRef: { name: app-config, key: REDIS_HOST } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: mjcart-secrets, key: jwt-secret } }
          readinessProbe:
            httpGet: { path: /health, port: 4001 }
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 4001 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---

# Requires the Prometheus Operator (installed via kube-prometheus-stack helm chart,
# see scripts/build-push.sh / README for the helm install command).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mjcart-services
  namespace: mjcart
  labels:
    release: prometheus   # must match the helm release label the Prometheus Operator watches
spec:
  namespaceSelector:
    matchNames: [mjcart]
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - api-gateway
          - auth-service
          - user-service
          - product-service
          - inventory-service
          - cart-service
          - order-service
          - shipping-service
          - notification-service
          - review-service
  endpoints:
    - port: http
      path: /metrics
      interval: 30s

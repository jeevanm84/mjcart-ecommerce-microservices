server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # In-cluster: NGINX Ingress routes /api to api-gateway directly (see k8s/ingress.yaml).
    # This block only matters if you run the frontend container standalone (docker-compose)
    # and want it to proxy /api itself.
    location /api/ {
        proxy_pass http://api-gateway:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
